name: CI

on:
  pull_request:
    branches: [main]

jobs:
  terraform-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - uses: terraform-linters/setup-tflint@v4
      - name: fmt check
        run: terraform fmt -check -recursive
        working-directory: terraform
      - name: init (no backend) and validate
        run: |
          terraform init -backend=false
          terraform validate
        working-directory: terraform
      - name: tflint
        run: |
          for d in . modules/networking modules/security modules/compute modules/monitoring; do
            echo "== tflint $d =="
            tflint --chdir="$d" --minimum-failure-severity=error
          done
        working-directory: terraform

  app-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt && pytest
        working-directory: app

  docker-build:
    runs-on: ubuntu-latest
    needs: [terraform-lint, app-test]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t app:ci ./app

  build-push-staging:
    needs: [docker-build]
    # forks don't get secrets, so only run for PRs from this repo
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      - name: Build and push to staging ECR
        id: meta
        run: |
          TAG=${GITHUB_SHA::8}
          REPO=${{ steps.ecr.outputs.registry }}/capstone3-staging
          docker build -t $REPO:$TAG ./app
          docker push $REPO:$TAG
          echo "tag=$TAG" >> $GITHUB_OUTPUT

  deploy-staging:
    needs: build-push-staging
    uses: ./.github/workflows/deploy-env.yml
    with:
      environment: staging
      image_tag: ${{ needs.build-push-staging.outputs.image_tag }}
    secrets: inherit
